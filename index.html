<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08152d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Мой помощник</title>
<style>
:root{--bg:#08152d;--panel:#102442;--panel2:#173154;--line:#27476c;--text:#edf5ff;--muted:#a7bfdc;--blue:#43a5ff;--cyan:#69e0ff;--red:#ff6179;--green:#56dfad;--gold:#ffd16b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15345a 0,#08152d 50%,#061020 100%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#1b3b61;color:var(--text);padding:10px 13px;border-radius:12px}button:hover{border-color:var(--blue)}input,select,textarea{width:100%;background:#091a31;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);margin:4px 0 10px}textarea{min-height:85px;resize:vertical}label{font-size:13px;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:24px;margin-bottom:4px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.wrap{max-width:780px;margin:auto;padding:16px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#2785ff,#4dd7f2);font-size:23px;box-shadow:0 5px 24px #1688ff55}.card{background:linear-gradient(145deg,#142c4b,#0d1e37);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 8px 25px #0002}.card.red{border-color:#874456;background:linear-gradient(145deg,#3a2638,#201d32)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.cardhead h2{margin:0}.count{border-radius:99px;background:#613246;color:#ffb9c5;padding:3px 9px;font-weight:700}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #ffffff12;padding:11px 0}.item:first-of-type{border-top:0}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;overflow-wrap:anywhere}.tag{font-size:11px;color:#a8d7ff;background:#1d4165;padding:3px 7px;border-radius:99px;display:inline-block;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:linear-gradient(120deg,#167cff,#20a8d8);border:0;font-weight:650}.danger{color:#ffb2bf;border-color:#864154;background:#3a2638}.good{color:#8ff0c7}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#122b4a;border:1px solid var(--line);padding:13px;border-radius:14px;text-align:left;min-height:76px}.tile strong{display:block;margin:5px 0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#08152df2;backdrop-filter:blur(16px);border-top:1px solid #27476c;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}.nav button{flex:1;max-width:130px;padding:8px 3px;border:0;background:transparent;color:#91a9c7;font-size:11px}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:#16395f;color:#8fdbff;border-radius:12px}.hidden{display:none!important}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:12px}.bar{height:8px;border-radius:99px;background:#07162a;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2b8cff,#57e2d2)}.metric{font-size:25px;font-weight:750}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;padding:8px 11px}.tabs button.active{background:#217ad0}.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.notice{background:#102c4b;border-left:3px solid var(--blue);padding:11px;border-radius:9px;color:#c6dcf5}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progressrow{display:flex;justify-content:space-between;gap:8px}.check{width:auto;margin:0}.footer-note{margin:18px 0;color:#7f9ab9;font-size:11px;text-align:center}
@media(min-width:650px){.wrap{padding-top:24px}.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:18px}}
</style></head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Мой помощник</h1><div class="muted" id="todayLabel">Главное · Сегодня</div></div></div><button onclick="go('settings')" aria-label="Настройки">⚙</button></header>
<main id="app"></main>
<div class="footer-note">Локальная версия · данные сохраняются в этом браузере</div>
</div>
<nav class="nav" id="nav">
<button data-page="home" onclick="go('home')" class="active"><span>⌂</span>Главная</button>
<button data-page="thoughts" onclick="go('thoughts')"><span>✧</span>Мысли</button>
<button data-page="tasks" onclick="go('tasks')"><span>☑</span>Задачи</button>
<button data-page="health" onclick="go('health')"><span>♡</span>Здоровье</button>
<button data-page="finance" onclick="go('finance')"><span>▣</span>Финансы</button>
<button data-page="settings" onclick="go('settings')"><span>⚙</span>Настройки</button>
</nav>
<script>
const KEY='myAssistantFull_v2';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!data||!Array.isArray(data.tasks))data={thoughts:[],tasks:[],payments:[],reminders:[],transactions:[],debts:[],savings:[],financeChat:[],activity:{},settings:{}};
['thoughts','tasks','payments','reminders','transactions','debts','trackers','savings','financeChat','paymentSchedules','paymentHistory'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return (Number(n)||0).toLocaleString('ru-RU')+' сум'}
function dateText(d){if(!d)return 'Дата не указана';return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function dueLabel(d){if(!d)return 'Срок не указан';let diff=Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);return diff<0?'Просрочено на '+Math.abs(diff)+' дн.':diff===0?'Сегодня':diff===1?'Завтра':'Осталось '+diff+' дн.'}
let page='home',finTab='overview',obligationTab='monthly',taskFilter='active',selectedThought=null,expenseMonth=today().slice(0,7),expensePeriod='month',expenseAnchor=today(),selectedExpenseCategory='';
function go(p){page=p;render();window.scrollTo(0,0)}
function activeTasks(){return data.tasks.filter(t=>!t.done)}
function activeThoughts(){return data.thoughts.filter(t=>!t.archived)}
function card(title,body,extra='',cls=''){return `<section class="card ${cls}"><div class="cardhead"><h2>${title}</h2>${extra}</div>${body}</section>`}
function rowItem(title,sub,buttons='',tag=''){return `<div class="item"><div class="itemmain"><strong>${esc(title)}</strong><div class="small">${esc(sub||'')}</div>${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>${buttons}</div>`}
function paymentItems(){const one=data.payments.filter(x=>!x.paid).map(p=>({...p,_kind:'one'}));const recurring=data.paymentSchedules.filter(x=>x.active!==false).map(p=>({...p,date:p.nextDate||p.date,_kind:'schedule'}));const loanPayments=data.debts.filter(d=>d.date&&Number(d.payment)>0).map(d=>({...d,amount:d.payment,_kind:'loan'}));return [...one,...recurring,...loanPayments].filter(p=>p.date&&p.date<=dateAfter(today(),14)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function dateAfter(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function home(){let payments=paymentItems();let ideas=activeThoughts().filter(t=>t.active!==false);let tasks=activeTasks().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,4);let reminders=data.reminders.filter(r=>!r.done&&r.date===today());
return `<div class="small">ГЛАВНОЕ · ${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>
${card('🔴 Срочные оплаты',payments.length?payments.map(p=>rowItem(p.title,`${p._kind==='schedule'?'По графику · ':p._kind==='loan'?'Платёж по кредиту · ':''}${dueLabel(p.date)} · ${money(p.amount)}`,`<button onclick="${p._kind==='schedule'?'markSchedulePaid':p._kind==='loan'?'markDebtPayment':'markPaid'}('${p.id}')">Оплачено</button>`)).join(''):'<div class="empty">Нет предстоящих оплат</div>',`<span class="count">${payments.length}</span>`,'red')}
${card('💡 Активные идеи',ideas.length?ideas.map(t=>rowItem(t.title,t.status||'Рабочая идея',`<button onclick="openThought('${t.id}')">Открыть</button>`)).join(''):'<div class="empty">Пока нет активных проектов</div>',`<button onclick="go('thoughts')">Все проекты →</button>`)}
<div class="actions"><button class="primary" onclick="addThought()">＋ Новая идея</button></div>
${card('☑ Ближайшие дела',tasks.length?tasks.map(t=>rowItem(t.title,`${dueLabel(t.date)}${t.time?' · '+t.time:''}`,`<button onclick="toggleTask('${t.id}')">✓</button>`,t.priority||'Обычный')).join(''):'<div class="empty">Активных дел нет</div>',`<button onclick="go('tasks')">Все дела →</button>`)}
${card('🔔 Напоминание на сегодня',reminders.length?reminders.map(r=>rowItem(r.title,'Сегодня',`<div class="actions"><button onclick="finishReminder('${r.id}')">Выполнено</button><button class="danger" onclick="deleteReminder('${r.id}')">Удалить</button></div>`)).join(''):'<div class="empty">На сегодня нет разовых напоминаний</div>',`<button onclick="addReminder()">＋ Добавить</button>`)}
${card('▣ Финансовый обзор',`<div class="row2"><div><div class="small">Доходы за записи</div><div class="metric good">${money(sum('income'))}</div></div><div><div class="small">Расходы за записи</div><div class="metric">${money(sum('expense'))}</div></div></div><div class="actions"><button onclick="go('finance')">Открыть финансы →</button></div>`)}
`}
function thoughts(){
 if(selectedThought){
  let t=data.thoughts.find(x=>x.id===selectedThought);
  if(!t){selectedThought=null;return thoughts()}
  t.chat=t.chat||[];
  const messages=t.chat.map(m=>`<div class="item"><div class="itemmain"><strong>${m.role==='user'?'Вы':'ИИ-помощник'}</strong><div style="white-space:pre-wrap">${esc(m.text)}</div></div></div>`).join('');
  return `<button onclick="selectedThought=null;render()">← Все мысли</button><section class="card"><h2>💡 ${esc(t.title)}</h2><div class="muted">${esc(t.text||'Описание пока не добавлено')}</div><div class="actions"><button onclick="editThought('${t.id}')">Изменить идею</button><button onclick="archiveThought('${t.id}')">В архив</button><button class="danger" onclick="deleteThought('${t.id}')">Удалить навсегда</button></div></section><section class="card"><h3>Обсуди эту идею с ИИ</h3><p class="small">Задавай вопросы, уточняй детали и проси составить пошаговый план. Идея не превращается в задачи автоматически.</p><div id="thoughtChatLog" style="max-height:420px;overflow:auto;margin:8px 0">${messages||'<div class="notice">Начни с вопроса: «Помоги разобраться, как реализовать эту идею».</div>'}</div><label for="thoughtChatInput">Твоё сообщение</label><textarea id="thoughtChatInput" placeholder="Напиши вопрос или уточнение..."></textarea><div class="actions"><button class="primary" id="thoughtSendBtn" onclick="sendThoughtChat('${t.id}')">Отправить ИИ</button></div><div id="thoughtChatStatus" class="small" aria-live="polite"></div></section><section class="card"><h3>Статус идеи</h3><select id="thoughtStatus"><option ${t.status==='Рабочая идея'?'selected':''}>Рабочая идея</option><option ${t.status==='В процессе'?'selected':''}>В процессе</option><option ${t.status==='Пауза'?'selected':''}>Пауза</option><option ${t.status==='Завершено'?'selected':''}>Завершено</option></select><button onclick="updateThought('${t.id}')">Сохранить статус</button></section>`;
 }
 return `<div class="section-title"><h2>Мысли и проекты</h2><button class="primary" onclick="addThought()">＋ Новая идея</button></div><p class="muted">Сохраняй идеи здесь и открывай каждую, чтобы обсуждать её с ИИ. В задачи идеи переходят только по твоему решению.</p>${activeThoughts().map(t=>`<section class="card">${rowItem(t.title,t.status||'Рабочая идея',`<button class="primary" onclick="openThought('${t.id}')">Открыть идею и чат</button>`)}<div class="small">${esc(t.text||'')}</div></section>`).join('')||'<div class="empty">Пока нет идей. Нажми «Новая идея».</div>'}<h3>Архив</h3>${data.thoughts.filter(t=>t.archived).map(t=>rowItem(t.title,'В архиве',`<button onclick="restoreThought('${t.id}')">Вернуть</button><button class="danger" onclick="deleteThought('${t.id}')">Удалить навсегда</button>`)).join('')||'<div class="small">Архив пуст</div>'}`;
}function tasks(){
  let list=data.tasks.filter(t=>taskFilter==='active'?!t.done:taskFilter==='done'?t.done:true);
  return `
    <div class="section-title">
      <h2>Задачи</h2>
      <button class="primary" onclick="addTask()">＋ Добавить</button>
    </div>

    <input id="taskSearch" placeholder="Поиск по своим задачам..." oninput="filterTaskRows(this.value)">

    <div class="tabs">
      <button class="${taskFilter==='active'?'active':''}" onclick="taskFilter='active';render()">Активные</button>
      <button class="${taskFilter==='done'?'active':''}" onclick="taskFilter='done';render()">Выполненные</button>
      <button class="${taskFilter==='all'?'active':''}" onclick="taskFilter='all';render()">Все</button>
    </div>

    <div id="taskRows">
${list.map(t=>rowItem(t.title,`${dateText(t.date)} ${t.time||''} · ${t.priority||'Обычный'}`,`<button style="flex-shrink:0" onclick="toggleTask('${t.id}')">${t.done?'↶':'✓'}</button><button class="danger" style="flex-shrink:0" onclick="deleteTask('${t.id}')">Удалить</button>`,` ${t.done?'Выполнено':''}`)).join('')||'<div class="empty">Задач пока нет</div>'} 
</div>
    <div class="card">
      <h3>ИИ-помощник по задачам</h3>
      <div id="taskAiLog" style="max-height:260px;overflow-y:auto;margin:12px 0;"></div>
      <textarea id="taskAiInput" placeholder="Напишите свой вопрос..."></textarea>
      <div class="actions">
        <button class="primary" onclick="sendTaskAI()">Отправить</button>
        <button onclick="clearTaskAI()">Очистить чат</button>
      </div>
      <div id="taskAiStatus" class="small" aria-live="polite"></div>
    </div>

    <div class="notice">Поиск на этой странице работает по сохранённым задачам. ИИ-помощник поможет их разобрать и расставить приоритеты.</div>
  `;
}
function filterTaskRows(q){document.querySelectorAll('#taskRows .item').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function health(){let days=Object.keys(data.activity||{}).sort().reverse();return `<h2>Спорт / здоровье</h2><section class="card"><h3>Сегодня · ${dateText(today())}</h3><label><input class="check" type="checkbox" ${data.activity[today()]?.done?'checked':''} onchange="setActivity(this.checked)"> Сегодня была физическая активность</label><label>Заметка (необязательно)</label><input id="activityNote" value="${esc(data.activity[today()]?.note||'')}" placeholder="Например: прогулка 30 минут"><button onclick="saveActivityNote()">Сохранить</button></section>${card('История',days.slice(0,14).map(d=>rowItem(dateText(d),data.activity[d].done?'Активность была':'Без отметки')).join('')||'<div class="empty">Отметок пока нет</div>')}`}
function sum(type){return data.transactions.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount||0),0)}
function savingBalance(g){return (g.entries||[]).reduce((a,e)=>a+(e.type==='add'?Number(e.amount||0):-Number(e.amount||0)),0)}
function totalSavings(){return (data.savings||[]).reduce((a,g)=>a+savingBalance(g),0)}
function autoExpenseCategory(title){
 const s=String(title||'').toLowerCase();
 const rules=[
  ['Сигареты',['сигарет','сигарета','сигареты','табак','пачка сигарет']],
  ['Бензин',['бензин','заправ','азс','топлив','дизел','метан','пропан','газпром']],
  ['Продукты',['продукт','магазин','супермаркет','хлеб','молоко','мясо','куриц','овощ','фрукт','яйц','круп','рис','масло']],
  ['Дом и коммунальные услуги',['коммун','квартир','аренд','электр','свет','водоснаб','отоплен','газ за','газоснаб']],
  ['Транспорт',['такси','автобус','метро','проезд','парков','мойка','шиномонтаж']],
  ['Здоровье',['аптек','лекар','врач','больниц','анализ','стомат','медицин']],
  ['Дети',['детсад','садик','детский сад','школ','ребен','ребён','игрушк','подгуз']],
  ['Связь и интернет',['интернет','телефон','связь','мобильн','тариф','пополнить счет']],
  ['Одежда и обувь',['одежд','обув','куртк','брюк','рубаш','кроссов']],
  ['Кафе и питание',['кафе','ресторан','обед','ужин','завтрак','кофе','доставка еды']],
  ['Кредиты и долги',['платеж по кредит','платёж по кредит','погашение кредита','кредитный платеж','долг']]
 ];
 for(const [cat,words] of rules)if(words.some(w=>s.includes(w)))return cat;
 return 'Прочее';
}
function expenseCategories(){const names=[...new Set(data.transactions.filter(t=>t.type==='expense').map(t=>(t.category||'Прочее').trim()))].filter(Boolean);return [...new Set(['Сигареты','Бензин','Продукты','Дом и коммунальные услуги','Транспорт','Здоровье','Дети','Связь и интернет','Одежда и обувь','Кафе и питание','Кредиты и долги','Прочее',...names])];}
function expenseRange(){const d=new Date((expenseAnchor||today())+'T12:00:00');let start,end;if(expensePeriod==='day'){start=end=expenseAnchor||today();}else if(expensePeriod==='week'){const wd=(d.getDay()+6)%7;const a=new Date(d);a.setDate(d.getDate()-wd);const b=new Date(a);b.setDate(a.getDate()+6);start=a.toISOString().slice(0,10);end=b.toISOString().slice(0,10);}else{start=(expenseAnchor||today()).slice(0,7)+'-01';const b=new Date(start+'T12:00:00');b.setMonth(b.getMonth()+1);b.setDate(0);end=b.toISOString().slice(0,10);}return {start,end};}
function expensesInPeriod(){const r=expenseRange();return data.transactions.filter(t=>t.type==='expense'&&t.date>=r.start&&t.date<=r.end);}
function selectExpenseCategory(cat){selectedExpenseCategory=cat;render()}
function expenseCategoryButton(cat){const tx=expensesInPeriod().filter(t=>(t.category||'Прочее')===cat);const total=tx.reduce((a,t)=>a+Number(t.amount||0),0);return `<button class="tile" onclick="selectExpenseCategory(decodeURIComponent('${encodeURIComponent(cat)}'))" style="text-align:left"><strong>${esc(cat)}</strong><span class="small">${tx.length} записей · ${money(total)}</span></button>`}
function debtRow(d){return `<div class="item"><div class="itemmain"><strong>${esc(d.title)}</strong><div class="small">Остаток: ${money(d.balance)} · Платёж: ${money(d.payment)} · ${dateText(d.date)}</div><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(d.progress)||0))}%"></i></div><div class="small">Погашено: ${Number(d.progress)||0}%</div></div><div class="actions"><button onclick="editDebt('${d.id}')">Изменить</button><button class="danger" onclick="deleteDebt('${d.id}')">Удалить</button></div></div>`}
function finance(){
 const income=sum('income'),expenses=sum('expense'),saved=totalSavings(),free=income-expenses-saved;
 const debtTotal=data.debts.reduce((a,d)=>a+Number(d.balance||0),0);
 const chat=(data.financeChat||[]).map(m=>`<div class="item"><div class="itemmain"><strong>${m.role==='user'?'Вы':'ИИ-помощник'}</strong><div style="white-space:pre-wrap">${esc(m.text)}</div></div></div>`).join('');

async function classifyExpenseCategory(title){const allowed=['Сигареты','Бензин','Продукты','Дом и коммунальные услуги','Транспорт','Здоровье','Дети','Связь и интернет','Одежда и обувь','Кафе и питание','Кредиты и долги','Прочее'];try{const promptText='Определи категорию расхода по описанию. Выбери строго одну категорию из списка и ответь только её названием, без пояснений: '+allowed.join(', ')+'. Описание расхода: '+title;const response=await fetch(GEMINI_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:promptText})});const result=await response.json();if(!response.ok||!result.answer)throw new Error('classification unavailable');const answer=String(result.answer).trim().toLowerCase();const found=allowed.find(c=>answer.includes(c.toLowerCase()));return found||autoExpenseCategory(title);}catch(e){return autoExpenseCategory(title)}}
async function addTransaction(type){type=type||prompt('Тип операции: income — доход, expense — расход','expense');if(!['income','expense'].includes(type))return;const title=prompt(type==='expense'?'Что купил или оплатил? Напиши обычными словами:':'Откуда доход?');if(!title||!title.trim())return;const raw=prompt('Сумма в сумах:','0');if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0)return alert('Укажи сумму больше нуля');let category;if(type==='expense'){const fallback=autoExpenseCategory(title);const suggested=await classifyExpenseCategory(title);category=prompt('ИИ определил категорию. Проверь её или исправь:',suggested||fallback);if(category===null)return;category=category.trim()||suggested||fallback;}else{category=prompt('Категория дохода (необязательно):','')||'';}const date=prompt('Дата YYYY-MM-DD:',today());if(date===null)return;if(date.trim()&&!/^\d{4}-\d{2}-\d{2}$/.test(date.trim()))return alert('Укажи дату в формате ГГГГ-ММ-ДД');let packs=0;if(type==='expense'&&(category.toLowerCase()==='сигареты'||/сигарет|табак/i.test(title))){const pr=prompt('Сколько пачек куплено? (можно оставить 0, если не знаешь):','1');if(pr===null)return;packs=Math.max(0,Number(pr)||0);}data.transactions.push({id:uid(),title:title.trim(),amount,category,type,date:date.trim()||today(),packs});save()}

 const savings=(data.savings||[]).map(g=>`${g.title} | ${g.kind==='reserve'?'Резерв':'Цель проекта'} | баланс ${savingBalance(g)} сум | цель ${g.target||0} сум`).join('\n');

 const history=data.financeChat.slice(-12).map(m=>(m.role==='user'?'Пользователь':'ИИ')+': '+m.text).join('\n');
 const promptText='Ты — личный финансовый помощник пользователя. Отвечай по-русски, кратко, спокойно и практично. Анализируй переданные реальные записи, не выдумывай отсутствующие данные. Помогай распределять расходы по категориям, оценивать доходы и обязательные платежи, предлагать посильные накопления и план погашения долгов. Не изменяй записи, не создавай операции и не утверждай переводы без явного подтверждения пользователя. Накопления не считай свободными деньгами. Пополнение накоплений — внутренний перевод, а не расход; снятие, если деньги потрачены, уже отражается в журнале расходов.\nТекущие операции пользователя:\n'+(tx||'Операций пока нет')+'\nНакопления:\n'+(savings||'Накоплений пока нет')+'\nДолги и кредиты:\n'+(debts||'Долгов пока нет')+'\nРегулярные платежи:\n'+(schedules||'Регулярных платежей пока нет')+'\nНеоплаченные обязательные платежи:\n'+(data.payments.filter(p=>!p.paid).map(p=>`${p.title} | ${p.amount} | ${p.date}`).join('\n')||'Нет')+'\nИстория диалога:\n'+history+'\nОтветь на последнее сообщение пользователя.';
 try{const response=await fetch(GEMINI_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:promptText})});const result=await response.json();if(!response.ok||!result.answer)throw new Error(result.error||('HTTP '+response.status));data.financeChat.push({role:'assistant',text:result.answer,date:today()});const aiLine=document.createElement('div');aiLine.className='item';const aiText=document.createElement('div');aiText.className='itemmain';aiText.textContent='ИИ-помощник: '+result.answer;aiText.style.whiteSpace='pre-wrap';aiLine.append(aiText);log.append(aiLine);status.textContent='Ответ получен.';localStorage.setItem(KEY,JSON.stringify(data));}
 catch(err){const errorText='Не удалось получить ответ: '+(err.message||'ошибка соединения');data.financeChat.push({role:'assistant',text:errorText,date:today()});status.textContent=errorText;localStorage.setItem(KEY,JSON.stringify(data));}

let taskAIHistory=[];

async function sendTaskAI(){
  const input=document.getElementById('taskAiInput');
  const log=document.getElementById('taskAiLog');
  const status=document.getElementById('taskAiStatus');
  if(!input||!log||!status)return;

  const message=input.value.trim();
  if(!message)return;

  const btn=document.querySelector('button[onclick="sendTaskAI()"]');
  input.value='';

  const userLine=document.createElement('div');
  userLine.className='item';
  const userText=document.createElement('div');
  userText.className='itemmain';
  const userStrong=document.createElement('strong');
  userStrong.textContent='Вы';
  const userBody=document.createElement('div');
  userBody.textContent=message;
  userText.append(userStrong,userBody);
  userLine.append(userText);
  log.append(userLine);

  taskAIHistory.push({role:'user',text:message});

  const tasksContext=data.tasks.map(t=>
    (t.done?'Выполнена':'Активна')+
    ' | '+t.title+
    ' | Дата: '+(t.date||'не указана')+
    ' | Время: '+(t.time||'не указано')+
    ' | Приоритет: '+(t.priority||'Обычный')
  ).join('\n');

  const history=taskAIHistory.slice(-12).map(m=>
    (m.role==='user'?'Пользователь':'ИИ')+': '+m.text
  ).join('\n');

 const promptText=
    'Ты — личный помощник пользователя. '+
    'Отвечай по-русски, кратко, уважительно и по делу. '+
    'Сегодняшняя дата: '+today()+'. '+
    'Называй задачу сегодняшней только если её дата точно совпадает с этой датой. '+
    'Задачи с более поздней датой называй будущими. '+
    'Если дата отсутствует, прямо называй задачу задачей без даты; не считай её сегодняшней даже при наличии времени. '+
    'Не придумывай даты и не делай вывод о дате по одному только времени. '+
    'Помогай разбирать задачи, определять приоритеты и составлять понятный порядок действий. '+
    'Не изменяй, не удаляй и не отмечай задачи выполненными самостоятельно. '+
    'Сначала предлагай решение, а любые изменения оставляй на подтверждение пользователя.\n\n'+
    'Список задач пользователя:\n'+(tasksContext||'Задач пока нет')+
    '\n\nИстория диалога:\n'+history+
    '\nОтветь на последнее сообщение пользователя.'

  status.textContent='Отправляю запрос в Gemini…';
  if(btn)btn.disabled=true;

  try{
    const response=await fetch(GEMINI_WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:promptText})
    });

    const result=await response.json();
    if(!response.ok||!result.answer)
      throw new Error(result.error||('HTTP '+response.status));

    taskAIHistory.push({role:'assistant',text:result.answer});

    const aiLine=document.createElement('div');
    aiLine.className='item';
    const aiText=document.createElement('div');
    aiText.className='itemmain';
    const aiStrong=document.createElement('strong');
    aiStrong.textContent='Gemini';
    const aiBody=document.createElement('div');
    aiBody.style.whiteSpace='pre-wrap';
    aiBody.textContent=result.answer;
    aiText.append(aiStrong,aiBody);
    aiLine.append(aiText);
    log.append(aiLine);

    status.textContent='Ответ получен.';
  }catch(err){
    status.textContent='Не удалось получить ответ: '+
      (err.message||'ошибка соединения');
  }finally{
    if(btn)btn.disabled=false;
    log.scrollTop=log.scrollHeight;
  }
}

function clearTaskAI(){
  taskAIHistory=[];
  const log=document.getElementById('taskAiLog');
  const status=document.getElementById('taskAiStatus');
  if(log)log.innerHTML='';
  if(status)status.textContent='Чат очищен.';
}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let el=document.getElementById('app');el.innerHTML=({home,thoughts,tasks,health,finance,settings}[page]||home)()}
function addThought(){let title=prompt('Название идеи или проекта:');if(!title||!title.trim())return;let text=prompt('Коротко опиши идею (можно пропустить):')||'';data.thoughts.push({id:uid(),title:title.trim(),text:text.trim(),status:'Рабочая идея',active:true,archived:false,notes:[],chat:[]});selectedThought=data.thoughts[data.thoughts.length-1].id;go('thoughts')}
function openThought(id){selectedThought=id;go('thoughts')}
function editThought(id){let t=data.thoughts.find(x=>x.id===id);if(!t)return;let title=prompt('Название идеи:',t.title);if(title===null||!title.trim())return;let text=prompt('Описание идеи:',t.text||'');if(text===null)return;t.title=title.trim();t.text=text.trim();save()}
function deleteThought(id){let t=data.thoughts.find(x=>x.id===id);if(!t)return;if(!confirm('Удалить идею «'+t.title+'» и её чат навсегда? Это действие нельзя отменить.'))return;data.thoughts=data.thoughts.filter(x=>x.id!==id);if(selectedThought===id)selectedThought=null;save()}
async function sendThoughtChat(id){const t=data.thoughts.find(x=>x.id===id),input=document.getElementById('thoughtChatInput'),status=document.getElementById('thoughtChatStatus'),btn=document.getElementById('thoughtSendBtn');if(!t||!input||!status)return;const message=input.value.trim();if(!message)return;t.chat=t.chat||[];t.chat.push({role:'user',text:message});input.value='';save();status.textContent='Отправляю запрос ИИ…';if(btn)btn.disabled=true;try{const history=t.chat.slice(-12).map(m=>(m.role==='user'?'Пользователь':'ИИ')+': '+m.text).join('\n');const promptText='Ты — личный помощник пользователя. Отвечай по-русски, кратко, уважительно и по делу. Сейчас обсуждается идея пользователя. Название: '+t.title+'. Описание: '+(t.text||'не указано')+'. Помогай прояснять идею и при просьбе составляй практический пошаговый план с материалами, примерными затратами и ожидаемым результатом. Не создавай задачи автоматически и не утверждай, что план принят без явного подтверждения пользователя. Продолжение диалога:\n'+history+'\nОтветь на последнее сообщение пользователя.';const response=await fetch(GEMINI_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:promptText})});const result=await response.json();if(!response.ok||!result.answer)throw new Error(result.error||('HTTP '+response.status));t.chat.push({role:'assistant',text:result.answer});status.textContent='Ответ получен.';}catch(err){t.chat.push({role:'assistant',text:'Не удалось получить ответ: '+(err.message||'ошибка соединения')+'. Проверь подключение ИИ и попробуй ещё раз.'});status.textContent='Ошибка соединения.';}finally{save();if(btn)btn.disabled=false;const log=document.getElementById('thoughtChatLog');if(log)log.scrollTop=log.scrollHeight;}}
function updateThought(id){let t=data.thoughts.find(x=>x.id===id);t.status=document.getElementById('thoughtStatus').value;t.active=t.status!=='Пауза'&&t.status!=='Завершено';if(t.status==='Завершено')t.archived=true;save()}
function archiveThought(id){let t=data.thoughts.find(x=>x.id===id);t.archived=true;t.active=false;selectedThought=null;save()}
function restoreThought(id){let t=data.thoughts.find(x=>x.id===id);t.archived=false;t.active=true;save()}
function addTask(){let title=prompt('Что нужно сделать?');if(!title)return;let date=prompt('Дата YYYY-MM-DD (можно пусто):','')||'';let time=prompt('Время (необязательно):','')||'';let priority=prompt('Приоритет: Срочно / Важно / Обычный','Обычный')||'Обычный';data.tasks.push({id:uid(),title,date,time,priority,done:false});save()}
function toggleTask(id){let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save()}function deleteTask(id){
  const t=data.tasks.find(x=>x.id===id);
  if(!t)return;
  if(!confirm('Удалить задачу «'+t.title+'» навсегда?'))return;
  data.tasks=data.tasks.filter(x=>x.id!==id);
  save();
}
function addReminder(){let title=prompt('Текст напоминания:');if(!title)return;let date=prompt('Дата YYYY-MM-DD:',today())||today();data.reminders.push({id:uid(),title,date,done:false});save()}
function finishReminder(id){let r=data.reminders.find(x=>x.id===id);r.done=true;save()}
function addPayment(){let title=prompt('Что оплатить?');if(!title)return;let amount=prompt('Сумма в сумах:','0');if(amount===null)return;let date=prompt('Срок YYYY-MM-DD:',today());if(date===null||!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Укажи дату в формате ГГГГ-ММ-ДД');data.payments.push({id:uid(),title,amount:Number(amount)||0,date,paid:false});save()}
function markPaid(id){let p=data.payments.find(x=>x.id===id);if(!p)return;p.paid=true;data.paymentHistory.push({id:uid(),title:p.title,amount:Number(p.amount)||0,date:today(),kind:'one'});save()}
function addSchedule(kind){const title=prompt('Название регулярного платежа (например, квартира, интернет):');if(!title||!title.trim())return;const amount=prompt('Сумма в сумах:','0');if(amount===null)return;const date=prompt('Ближайшая дата оплаты YYYY-MM-DD:',today());if(date===null||!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Укажи дату в формате ГГГГ-ММ-ДД');const remind=prompt('За сколько дней напоминать?','3');if(remind===null)return;data.paymentSchedules.push({id:uid(),title:title.trim(),amount:Number(amount)||0,nextDate:date,frequency:'monthly',kind:kind||'monthly',remindDays:Math.max(0,Math.min(30,Number(remind)||0)),active:true});save()}
function nextMonthDate(date){const d=new Date(date+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.toISOString().slice(0,10)}
function markSchedulePaid(id){const p=data.paymentSchedules.find(x=>x.id===id);if(!p)return;data.paymentHistory.push({id:uid(),title:p.title,amount:Number(p.amount)||0,date:today(),kind:'recurring',scheduleId:id});p.nextDate=nextMonthDate(p.nextDate||today());while(p.nextDate<=today())p.nextDate=nextMonthDate(p.nextDate);save()}
function markDebtPayment(id){const d=data.debts.find(x=>x.id===id);if(!d)return;data.paymentHistory.push({id:uid(),title:d.title,amount:Number(d.payment)||0,date:today(),kind:'loan'});d.date=nextMonthDate(d.date||today());while(d.date<=today())d.date=nextMonthDate(d.date);save()}
function editSchedule(id){const p=data.paymentSchedules.find(x=>x.id===id);if(!p)return;const title=prompt('Название платежа:',p.title);if(title===null||!title.trim())return;const amount=prompt('Сумма в сумах:',String(p.amount));if(amount===null)return;const date=prompt('Следующая дата оплаты YYYY-MM-DD:',p.nextDate);if(date===null||!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Проверь дату');const days=prompt('Напоминать за сколько дней:',String(p.remindDays??3));if(days===null)return;p.title=title.trim();p.amount=Number(amount)||0;p.nextDate=date;p.remindDays=Math.max(0,Math.min(30,Number(days)||0));save()}
function deleteSchedule(id){if(!confirm('Удалить этот график платежей? История оплат сохранится.'))return;data.paymentSchedules=data.paymentSchedules.filter(x=>x.id!==id);save()}

function addDebt(kind){let title=prompt(kind==='small'?'Название мелкого долга или рассрочки:':'Название крупного кредита:');if(!title)return;let balance=prompt('Остаток долга в сумах:','0');let payment=prompt('Регулярный платёж в сумах:','0');let date=prompt('Следующая дата платежа YYYY-MM-DD:','')||'';let progress=prompt('Погашено, % (если знаешь):','0');data.debts.push({id:uid(),title,kind:kind||'large',balance:Number(balance)||0,payment:Number(payment)||0,date,progress:Number(progress)||0});save()}
function editDebt(id){let d=data.debts.find(x=>x.id===id);let b=prompt('Текущий остаток в сумах:',d.balance);if(b===null)return;d.balance=Number(b)||0;let p=prompt('Регулярный платёж в сумах:',d.payment);if(p!==null)d.payment=Number(p)||0;let date=prompt('Следующая дата YYYY-MM-DD:',d.date||'');if(date!==null)d.date=date;let pr=prompt('Погашено, %:',d.progress);if(pr!==null)d.progress=Math.min(100,Math.max(0,Number(pr)||0));save()}
function setActivity(v){data.activity[today()]=data.activity[today()]||{};data.activity[today()].done=v;save()}
function saveActivityNote(){data.activity[today()]=data.activity[today()]||{};data.activity[today()].note=document.getElementById('activityNote').value;save()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moj-pomoshchnik-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.tasks)||!Array.isArray(x.thoughts))throw Error();data=x;['thoughts','tasks','payments','reminders','transactions','debts','trackers','savings','financeChat','paymentSchedules','paymentHistory'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});if(!data.activity||typeof data.activity!=='object')data.activity={};save();alert('Резервная копия восстановлена')}catch(err){alert('Не удалось прочитать резервную копию')}};r.readAsText(f)}
render();
